services:
  talkcheck:
    build:
      context: .
      args:
        HANDOFF_UI_BASE: /talkcheck/
    container_name: talkcheck
    restart: unless-stopped
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      PORT: 8080
      TAX_INVOICE_HANDOFF_MODE: local
      HANDOFF_PUBLIC_BASE_URL: https://risk.moodwave.kr/talkcheck
      OCR_PROVIDER: tesseract
      OCR_LANGUAGES: kor+eng
      NTS_API_TIMEOUT_SECONDS: "1.2"
      NTS_API_MAX_ATTEMPTS: "2"
    ports:
      - "127.0.0.1:8095:8080"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8080/health')
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
